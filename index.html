<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MoneyTrail · Track Every Dollar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body { @apply bg-gray-900 text-gray-100; }
    .fade-in { animation: fade 0.2s ease-in; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .income-text { @apply text-green-400 font-semibold; }
    .expense-text { @apply text-red-400 font-semibold; }
  </style>
</head>
<body>

  <div class="max-w-md mx-auto bg-gray-900 min-h-screen pb-24">
    
    <!-- Header -->
    <div class="bg-gradient-to-r from-gray-800 to-gray-700 text-white p-6 rounded-b-3xl shadow-lg">
      <div class="flex justify-between items-center">
        <h1 class="text-3xl font-bold"><i class="fas fa-landmark mr-2"></i>MoneyTrail</h1>
        <div class="bg-gray-600 px-4 py-2 rounded-full text-sm font-mono">
          <span class="text-gray-300">Balance:</span> <span class="income-text">$<span id="totalBalance">0.00</span></span>
        </div>
      </div>
      <p class="text-gray-300 text-sm mt-2">Track every dollar, stack every dollar</p>
    </div>

    <!-- Quick Add Form -->
    <div class="bg-gray-800 p-4 mx-3 mt-4 rounded-2xl shadow-lg border border-gray-700">
      <div class="flex flex-col gap-3">
        <input type="text" id="desc" placeholder="Description (e.g., Coffee, Salary)" 
               class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-green-500">
        <div class="flex gap-2">
          <input type="number" id="amount" placeholder="0.00" step="0.01" 
                 class="flex-1 p-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-green-500">
          <select id="type" class="p-3 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-2 focus:ring-green-500">
            <option value="expense">💸 Expense</option>
            <option value="income">💰 Income</option>
          </select>
        </div>
        <button id="addBtn" class="w-full bg-green-600 hover:bg-green-700 text-white px-5 py-3 rounded-lg font-semibold transition flex items-center justify-center gap-2">
          <i class="fas fa-plus"></i> Add Entry
        </button>
      </div>
    </div>

    <!-- Filter & Summary -->
    <div class="flex justify-between items-center mx-3 mt-4 gap-2">
      <div class="flex gap-2">
        <button id="filterAll" class="filter-btn text-xs px-3 py-1 rounded-full bg-green-600 text-white">All</button>
        <button id="filterIncome" class="filter-btn text-xs px-3 py-1 rounded-full bg-gray-700 text-gray-300">Income</button>
        <button id="filterExpense" class="filter-btn text-xs px-3 py-1 rounded-full bg-gray-700 text-gray-300">Expenses</button>
      </div>
      <div class="text-xs bg-gray-800 px-3 py-1 rounded-full">
        Net: <span id="netAmount" class="income-text">$0.00</span>
      </div>
    </div>

    <!-- Transaction List -->
    <div class="mx-3 mt-4 mb-4">
      <h2 class="text-gray-400 text-xs font-semibold uppercase tracking-wide mb-3"><i class="fas fa-list"></i> Recent Entries</h2>
      <div id="transactionList" class="space-y-2">
        <div class="text-center text-gray-500 py-6 text-sm">No transactions yet – add your first entry.</div>
      </div>
    </div>

  </div>

  <!-- Floating Action Button -->
  <div class="fixed bottom-6 right-6 bg-green-600 hover:bg-green-700 text-white rounded-full w-14 h-14 flex items-center justify-center shadow-lg cursor-pointer transition" id="fabBtn">
    <i class="fas fa-plus text-xl"></i>
  </div>

  <script src="app.js"></script>
</body>
</html>
